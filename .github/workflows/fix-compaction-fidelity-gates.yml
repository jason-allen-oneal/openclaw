name: Fix Compaction Fidelity Gates

on:
  push:
    branches:
      - ci/fix-compaction-fidelity-gates

permissions:
  contents: write

env:
  NODE_VERSION: "24.x"
  TARGET_BRANCH: feat/judgment-compaction-fidelity
  STACK_BASE: d220d8c5c1a1a100374715626b5c4419855e490c

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove unnecessary type assertions and wire diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          context = Path("src/agents/agent-hooks/compaction-safeguard-context.ts")
          text = context.read_text()
          import_line = 'import { asOptionalRecord } from "@openclaw/normalization-core/record-coerce";\n'
          if import_line not in text:
              text = text.replace(
                  'import { sliceUtf16Safe, truncateUtf16Safe } from "@openclaw/normalization-core/utf16-slice";\n',
                  import_line + 'import { sliceUtf16Safe, truncateUtf16Safe } from "@openclaw/normalization-core/utf16-slice";\n',
              )
          text = text.replace(
              '  const content = (message as { content?: unknown }).content;',
              '  const content = asOptionalRecord(message)?.content;',
          )
          text = text.replace(
              '          const text =\n            block && typeof block === "object" ? (block as { text?: unknown }).text : undefined;',
              '          const text = asOptionalRecord(block)?.text;',
          )
          text = text.replace(
              '    const typeRaw = (block as { type?: unknown }).type;',
              '    const typeRaw = asOptionalRecord(block)?.type;',
          )
          text = text.replace(
              '    const toolName = (message as { toolName?: unknown }).toolName;',
              '    const toolName = asOptionalRecord(message)?.toolName;',
          )
          text = text.replace(
              '    formatNonTextPlaceholder((message as { content?: unknown }).content),',
              '    formatNonTextPlaceholder(asOptionalRecord(message)?.content),',
          )
          context.write_text(text)

          semantic = Path("src/agents/agent-hooks/compaction-safeguard-semantic.ts")
          text = semantic.read_text()
          if import_line not in text:
              text = text.replace('import { createHash } from "node:crypto";\n', 'import { createHash } from "node:crypto";\n' + import_line)
          text = text.replace(
              '    const type = (block as { type?: unknown }).type;',
              '    const type = asOptionalRecord(block)?.type;',
          )
          text = text.replace(
              '      const record = block as Record<string, unknown>;',
              '      const record = asOptionalRecord(block);\n      if (!record) {\n        return [];\n      }',
          )
          old_render = '''  const role = typeof message.role === "string" ? message.role : "unknown";
  const toolName =
    message.role === "toolResult" &&
    typeof (message as { toolName?: unknown }).toolName === "string"
      ? String((message as { toolName?: unknown }).toolName)
      : "";
  const rawContent = (message as { content?: unknown }).content;'''
          new_render = '''  const role = typeof message.role === "string" ? message.role : "unknown";
  const messageRecord = asOptionalRecord(message);
  const rawToolName = messageRecord?.toolName;
  const toolName =
    message.role === "toolResult" && typeof rawToolName === "string" ? rawToolName : "";
  const rawContent = messageRecord?.content;'''
          if old_render not in text:
              raise SystemExit("semantic render assertion block not found")
          text = text.replace(old_render, new_render)
          old_fingerprint = '''    messages.map((message) => ({
      role: message.role,
      timestamp: (message as { timestamp?: unknown }).timestamp,
      content: (message as { content?: unknown }).content,
      toolCallId: (message as { toolCallId?: unknown }).toolCallId,
      toolUseId: (message as { toolUseId?: unknown }).toolUseId,
      toolName: (message as { toolName?: unknown }).toolName,
      isError: (message as { isError?: unknown }).isError,
      details: (message as { details?: unknown }).details,
    })),'''
          new_fingerprint = '''    messages.map((message) => {
      const record = asOptionalRecord(message);
      return {
        role: message.role,
        timestamp: record?.timestamp,
        content: record?.content,
        toolCallId: record?.toolCallId,
        toolUseId: record?.toolUseId,
        toolName: record?.toolName,
        isError: record?.isError,
        details: record?.details,
      };
    }),'''
          if old_fingerprint not in text:
              raise SystemExit("semantic fingerprint assertion block not found")
          text = text.replace(old_fingerprint, new_fingerprint)
          semantic.write_text(text)

          safeguard = Path("src/agents/agent-hooks/compaction-safeguard.ts")
          text = safeguard.read_text()
          text = text.replace(
              'import { evaluateJudgment } from "../../judgments/runtime.js";',
              'import { evaluateJudgment, recordJudgmentOutcome } from "../../judgments/runtime.js";',
          )
          text = text.replace(
              'runtime: { evaluate: evaluateJudgment },',
              'runtime: { evaluate: evaluateJudgment, recordOutcome: recordJudgmentOutcome },',
          )
          safeguard.write_text(text)

          tests = Path("src/agents/agent-hooks/compaction-safeguard-semantic.test.ts")
          text = tests.read_text()
          text = text.replace(
              '    expect(snapshot.segments).toHaveLength(3);\n  });',
              '    expect(snapshot.segments).toHaveLength(3);\n    expect(runtime.recordOutcome).toHaveBeenCalledWith("accepted");\n  });',
              1,
          )
          text = text.replace(
              '    expect(result.assessments).toEqual([\n      expect.objectContaining({\n        obligationId,\n        classification: "preserved",\n      }),\n    ]);',
              '    expect(result.assessments).toEqual([\n      expect.objectContaining({\n        obligationId,\n        classification: "preserved",\n      }),\n    ]);\n    expect(runtime.recordOutcome).toHaveBeenCalledWith("no-change");',
          )
          tests.write_text(text)
          PY

      - name: Format changed TypeScript
        run: >-
          pnpm exec oxfmt --write
          src/agents/agent-hooks/compaction-safeguard-context.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.ts
          src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/agent-hooks/compaction-safeguard.ts

      - name: Validate config metadata
        run: pnpm config:docs:check

      - name: Focused tests
        run: >-
          node scripts/run-vitest.mjs
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/embedded-agent-runner/extensions.test.ts
          src/config/config.compaction-settings.test.ts

      - name: Changed checks
        run: pnpm check:changed --base ${{ env.STACK_BASE }}

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/agents/agent-hooks/compaction-safeguard-context.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic.test.ts \
            src/agents/agent-hooks/compaction-safeguard.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(compaction): satisfy semantic judgment safety gates"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          fi
