name: Fix Compaction Fidelity Gates

on:
  push:
    branches:
      - ci/fix-compaction-fidelity-gates

permissions:
  contents: write

env:
  NODE_VERSION: "24.x"
  TARGET_BRANCH: feat/judgment-compaction-fidelity
  STACK_BASE: d220d8c5c1a1a100374715626b5c4419855e490c

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository gate fixes
        run: python .github/scripts/fix-compaction-fidelity-gates.py

      - name: Format changed TypeScript
        run: >-
          pnpm exec oxfmt --write
          src/agents/agent-hooks/compaction-safeguard-context.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.ts
          src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/agent-hooks/compaction-safeguard.ts

      - name: Validate config metadata
        run: pnpm config:docs:check

      - name: Focused tests
        run: >-
          node scripts/run-vitest.mjs
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/embedded-agent-runner/extensions.test.ts
          src/config/config.compaction-settings.test.ts

      - name: Changed checks
        run: pnpm check:changed --base ${{ env.STACK_BASE }}

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/agents/agent-hooks/compaction-safeguard-context.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic.test.ts \
            src/agents/agent-hooks/compaction-safeguard.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(compaction): satisfy semantic judgment safety gates"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          fi
