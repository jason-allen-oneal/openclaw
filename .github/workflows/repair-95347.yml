name: Repair PR 95347

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Rebase and validate
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/repair-95347.sh 2>&1 | tee /tmp/pr-95347-repair.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-95347-repair-log
          path: /tmp/pr-95347-repair.log
          if-no-files-found: warn
