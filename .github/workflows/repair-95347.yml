name: Repair PR 95347

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Capture merge inputs against upstream main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openclaw/openclaw.git
          git fetch upstream main
          old_head=$(git rev-parse HEAD)
          base=$(git merge-base upstream/main "$old_head")
          mkdir -p /tmp/pr-95347
          git show upstream/main:extensions/memory-core/src/tools.ts > /tmp/pr-95347/tools-main.ts
          git show "$old_head":extensions/memory-core/src/tools.ts > /tmp/pr-95347/tools-old.ts
          git diff "$base" "$old_head" -- extensions/memory-core/src/tools.ts > /tmp/pr-95347/tools-pr.patch
          {
            echo "OLD_HEAD=$old_head"
            echo "MERGE_BASE=$base"
            echo "UPSTREAM_MAIN=$(git rev-parse upstream/main)"
            git reset --hard upstream/main
            git merge --no-commit --no-ff "$old_head" || true
            cp extensions/memory-core/src/tools.ts /tmp/pr-95347/tools-conflict.ts
            echo "--- STATUS ---"
            git status --short
            echo "--- CONFLICT FILES ---"
            git diff --name-only --diff-filter=U
            echo "--- CONFLICT MARKERS ---"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "===== $file ====="
              grep -n -C 12 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
            done < <(git diff --name-only --diff-filter=U)
          } > /tmp/pr-95347/diagnostic.txt 2>&1
          cat /tmp/pr-95347/diagnostic.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pr-95347-merge-inputs
          path: /tmp/pr-95347
          if-no-files-found: error
