name: Repair Judgment Compaction Fidelity

on:
  push:
    branches:
      - ci/repair-judgment-compaction-fidelity-20260919

permissions:
  contents: write

env:
  NODE_VERSION: "24.x"
  TARGET_BRANCH: repair/judgment-compaction-fidelity-clean
  BASE_SHA: d220d8c5c1a1a100374715626b5c4419855e490c

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Fetch repair script
        run: curl -fsSL https://raw.githubusercontent.com/jason-allen-oneal/openclaw/ci/repair-judgment-compaction-fidelity-20260919/scripts/repair-judgment-compaction-fidelity.py -o /tmp/repair-fidelity.py

      - name: Fetch comparison base
        run: git fetch origin "${BASE_SHA}" --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair review findings
        run: python /tmp/repair-fidelity.py

      - name: Finalize judgment runtime contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts")
          text = path.read_text()

          old = 'runtime: Pick<JudgmentRuntimeV1, "evaluate">;'
          if text.count(old) != 2:
              raise SystemExit(f"expected two runtime contract matches, found {text.count(old)}")
          text = text.replace(
              old,
              'runtime: Pick<JudgmentRuntimeV1, "evaluate" | "recordOutcome">;',
          )

          text = text.replace(
              '''  if (eligible.length === 0) {
            return allRetainedResult(params.snapshot, "skipped", "no-discretionary-segments");
          }
          if (params.snapshot.obligations.length === 0) {
            return allRetainedResult(params.snapshot, "skipped", "no-source-backed-obligations");
          }
          ''',
              '''  if (eligible.length === 0) {
            await params.runtime.recordOutcome("no-change");
            return allRetainedResult(params.snapshot, "skipped", "no-discretionary-segments");
          }
          if (params.snapshot.obligations.length === 0) {
            await params.runtime.recordOutcome("no-change");
            return allRetainedResult(params.snapshot, "skipped", "no-source-backed-obligations");
          }
          ''',
              1,
          )

          first_unavailable = '''  if (outcome.status !== "ok") {
            return allRetainedResult(params.snapshot, "unavailable", outcome.reason);
          }
          '''
          if first_unavailable not in text:
              raise SystemExit("shadow unavailable block not found")
          text = text.replace(
              first_unavailable,
              '''  if (outcome.status !== "ok") {
            await params.runtime.recordOutcome("fallback");
            return allRetainedResult(params.snapshot, "unavailable", outcome.reason);
          }
          ''',
              1,
          )

          old_complete = '''  return {
            status: "ok",
            sourceFingerprint: params.snapshot.sourceFingerprint,
            selectedSegmentIds,
            excludedSegmentIds: [...excluded],
            uncertainSegmentIds: [...uncertain],
            evaluatedSegmentIds: [...evaluated],
            originalChars: params.snapshot.originalChars,
            selectedChars,
            reductionRatio,
            complete:
              params.snapshot.complete &&
              eligible.length <= MAX_SEGMENTS_PER_JUDGMENT &&
              evaluated.size === candidates.length &&
              uncertain.size === 0,
            provenance: outcome.provenance,
            ...(outcome.result.usage ? { usage: outcome.result.usage } : {}),
          };
          '''
          new_complete = '''  const complete =
            params.snapshot.complete &&
            eligible.length <= MAX_SEGMENTS_PER_JUDGMENT &&
            evaluated.size === candidates.length &&
            uncertain.size === 0;
          await params.runtime.recordOutcome(
            !complete ? "fallback" : excluded.size > 0 ? "accepted" : "no-change",
          );
          return {
            status: "ok",
            sourceFingerprint: params.snapshot.sourceFingerprint,
            selectedSegmentIds,
            excludedSegmentIds: [...excluded],
            uncertainSegmentIds: [...uncertain],
            evaluatedSegmentIds: [...evaluated],
            originalChars: params.snapshot.originalChars,
            selectedChars,
            reductionRatio,
            complete,
            provenance: outcome.provenance,
            ...(outcome.result.usage ? { usage: outcome.result.usage } : {}),
          };
          '''
          if old_complete not in text:
              raise SystemExit("shadow completion block not found")
          text = text.replace(old_complete, new_complete, 1)

          fidelity_empty = '''  if (params.snapshot.obligations.length === 0) {
            return {
              status: "skipped",
              sourceFingerprint: params.snapshot.sourceFingerprint,
              candidateFingerprint,
              reason: "no-source-backed-obligations",
            };
          }
          '''
          if fidelity_empty not in text:
              raise SystemExit("fidelity empty block not found")
          text = text.replace(
              fidelity_empty,
              '''  if (params.snapshot.obligations.length === 0) {
            await params.runtime.recordOutcome("no-change");
            return {
              status: "skipped",
              sourceFingerprint: params.snapshot.sourceFingerprint,
              candidateFingerprint,
              reason: "no-source-backed-obligations",
            };
          }
          ''',
              1,
          )

          fidelity_unavailable = '''  if (outcome.status !== "ok") {
            return {
              status: "unavailable",
              sourceFingerprint: params.snapshot.sourceFingerprint,
              candidateFingerprint,
              reason: outcome.reason,
            };
          }
          '''
          if fidelity_unavailable not in text:
              raise SystemExit("fidelity unavailable block not found")
          text = text.replace(
              fidelity_unavailable,
              '''  if (outcome.status !== "ok") {
            await params.runtime.recordOutcome("fallback");
            return {
              status: "unavailable",
              sourceFingerprint: params.snapshot.sourceFingerprint,
              candidateFingerprint,
              reason: outcome.reason,
            };
          }
          ''',
              1,
          )

          final_return = '''  return {
            status: "ok",
            sourceFingerprint: params.snapshot.sourceFingerprint,
            candidateFingerprint,
            assessments,
            provenance: outcome.provenance,
            ...(outcome.result.usage ? { usage: outcome.result.usage } : {}),
          };
          '''
          if final_return not in text:
              raise SystemExit("fidelity success return not found")
          text = text.replace(
              final_return,
              '''  await params.runtime.recordOutcome("accepted");
          return {
            status: "ok",
            sourceFingerprint: params.snapshot.sourceFingerprint,
            candidateFingerprint,
            assessments,
            provenance: outcome.provenance,
            ...(outcome.result.usage ? { usage: outcome.result.usage } : {}),
          };
          ''',
              1,
          )

          path.write_text(text)
          PY

      - name: Annotate assertion invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              "src/agents/agent-hooks/compaction-safeguard-context.ts":
                  "Message and content shapes are narrowed by the surrounding role and object checks.",
              "src/agents/agent-hooks/compaction-safeguard-semantic.ts":
                  "Serialized message and content shapes are narrowed by the surrounding runtime checks.",
          }

          for path, invariant in targets.items():
              lines = Path(path).read_text().splitlines()
              output: list[str] = []
              for line in lines:
                  stripped = line.lstrip()
                  is_assertion = (
                      " as " in line
                      and " as const" not in line
                      and not stripped.startswith("import ")
                      and not stripped.startswith("export type ")
                      and not stripped.startswith("type ")
                  )
                  if is_assertion and not (
                      output and output[-1].lstrip().startswith("// SAFETY:")
                  ):
                      indent = line[: len(line) - len(stripped)]
                      output.append(f"{indent}// SAFETY: {invariant}")
                  output.append(line)
              Path(path).write_text("\n".join(output) + "\n")
          PY

      - name: Format changed files
        run: >-
          pnpm exec oxfmt --write
          src/agents/agent-hooks/compaction-safeguard-context.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.ts
          src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/agent-hooks/compaction-safeguard.ts

      - name: Validate generated config metadata
        run: pnpm config:docs:check

      - name: Run focused compaction tests
        run: >-
          node scripts/run-vitest.mjs
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/agent-hooks/compaction-safeguard.test.ts
          src/agents/embedded-agent-runner/extensions.test.ts
          src/config/config.compaction-settings.test.ts

      - name: Run changed gate
        run: pnpm check:changed --base ${{ env.BASE_SHA }}

      - name: Squash repaired branch
        shell: bash
        run: |
          git config user.name "Jason O'Neal"
          git config user.email "jason.allen.oneal@gmail.com"
          git reset --soft "${BASE_SHA}"
          git add -A
          git commit -m "feat(compaction): observe semantic fidelity and shadow curation"
          git push --force-with-lease origin "HEAD:${TARGET_BRANCH}"
