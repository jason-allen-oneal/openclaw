name: Repair Judgment Compaction Fidelity

on:
  push:
    branches:
      - ci/repair-judgment-compaction-fidelity-20260919

permissions:
  contents: write

env:
  NODE_VERSION: "24.x"
  TARGET_BRANCH: repair/judgment-compaction-fidelity-clean
  BASE_SHA: d220d8c5c1a1a100374715626b5c4419855e490c

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Fetch repair script
        run: curl -fsSL https://raw.githubusercontent.com/jason-allen-oneal/openclaw/ci/repair-judgment-compaction-fidelity-20260919/scripts/repair-judgment-compaction-fidelity.py -o /tmp/repair-fidelity.py

      - name: Fetch comparison base
        run: git fetch origin "${BASE_SHA}" --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair review findings
        run: python /tmp/repair-fidelity.py

      - name: Fix typecheck details
        run: |
          python - <<'PY'
          from pathlib import Path

          judgments = Path("src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts")
          text = judgments.read_text()
          old = "  const assessments = params.snapshot.obligations.map((obligation) => {"
          new = '''  const assessments: Extract<
            CompactionFidelityResult,
            { status: "ok" }
          >["assessments"] = params.snapshot.obligations.map((obligation) => {'''
          if text.count(old) != 1:
              raise SystemExit(f"assessment declaration: expected one match, found {text.count(old)}")
          judgments.write_text(text.replace(old, new, 1))

          safeguard = Path("src/agents/agent-hooks/compaction-safeguard.ts")
          text = safeguard.read_text()
          unused = '''function nestMarkdownHeadings(text: string): string {
            return text.replace(/^##(?=[ \\t]+\\S)/gmu, "###");
          }

          '''
          if text.count(unused) != 1:
              raise SystemExit(f"unused heading helper: expected one match, found {text.count(unused)}")
          safeguard.write_text(text.replace(unused, "", 1))
          PY

      - name: Annotate assertion invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = {
              "src/agents/agent-hooks/compaction-safeguard-context.ts":
                  "Message and content shapes are narrowed by the surrounding role and object checks.",
              "src/agents/agent-hooks/compaction-safeguard-semantic.ts":
                  "Serialized message and content shapes are narrowed by the surrounding runtime checks.",
          }

          for path, invariant in targets.items():
              lines = Path(path).read_text().splitlines()
              output: list[str] = []
              for line in lines:
                  stripped = line.lstrip()
                  is_assertion_line = (
                      re.search(r"\bas\b", line) is not None
                      and not stripped.startswith("import ")
                      and not stripped.startswith("export type ")
                      and not stripped.startswith("type ")
                      and not stripped.startswith("//")
                  )
                  if is_assertion_line and not (
                      output and output[-1].lstrip().startswith("// SAFETY:")
                  ):
                      indent = line[: len(line) - len(stripped)]
                      output.append(f"{indent}// SAFETY: {invariant}")
                  output.append(line)
              Path(path).write_text("\n".join(output) + "\n")
          PY

      - name: Format changed files
        run: >-
          pnpm exec oxfmt --write
          src/agents/agent-hooks/compaction-safeguard-context.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.ts
          src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/agent-hooks/compaction-safeguard.ts

      - name: Pin assertion comments after formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = {
              "src/agents/agent-hooks/compaction-safeguard-context.ts":
                  "Message and content shapes are narrowed by the surrounding role and object checks.",
              "src/agents/agent-hooks/compaction-safeguard-semantic.ts":
                  "Serialized message and content shapes are narrowed by the surrounding runtime checks.",
          }

          for path, invariant in targets.items():
              lines = Path(path).read_text().splitlines()
              output: list[str] = []
              for line in lines:
                  stripped = line.lstrip()
                  operator_line = (
                      re.search(r"\bas\b", line) is not None
                      and not stripped.startswith("import ")
                      and not stripped.startswith("export type ")
                      and not stripped.startswith("type ")
                      and not stripped.startswith("//")
                  )
                  if operator_line and not (
                      output and output[-1].lstrip().startswith("// SAFETY:")
                  ):
                      indent = line[: len(line) - len(stripped)]
                      output.append(f"{indent}// SAFETY: {invariant}")
                  output.append(line)
              Path(path).write_text("\n".join(output) + "\n")
          PY

      - name: Shrink assertion safety baseline
        run: node --import ./scripts/tsx.mjs scripts/check-assertion-safety-ratchet.mts --prune --base ${{ env.BASE_SHA }}

      - name: Validate assertion comments
        run: node --import ./scripts/tsx.mjs scripts/check-assertion-safety-ratchet.mts --base ${{ env.BASE_SHA }}

      - name: Validate generated config metadata
        run: pnpm config:docs:check

      - name: Run focused compaction tests
        run: >-
          node scripts/run-vitest.mjs
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/agent-hooks/compaction-safeguard.test.ts
          src/agents/embedded-agent-runner/extensions.test.ts
          src/config/config.compaction-settings.test.ts

      - name: Run changed gate
        run: pnpm check:changed --base ${{ env.BASE_SHA }}

      - name: Squash repaired branch
        shell: bash
        run: |
          git config user.name "Jason O'Neal"
          git config user.email "jason.allen.oneal@gmail.com"
          git reset --soft "${BASE_SHA}"
          git add -A
          git commit -m "feat(compaction): observe semantic fidelity and shadow curation"
          git push --force-with-lease origin "HEAD:${TARGET_BRANCH}"
