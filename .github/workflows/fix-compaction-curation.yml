name: Fix Compaction Curation

on:
  push:
    branches:
      - ci/fix-compaction-curation

permissions:
  contents: write

env:
  NODE_VERSION: "24.x"
  TARGET_BRANCH: feat/judgment-compaction-curation
  STACK_BASE: 4b53a97692a87b0209f83848dd9270f6ee6ca141

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Fetch repair scripts and stacked base
        run: |
          git fetch origin refs/heads/ci/fix-compaction-curation:refs/remotes/origin/ci/fix-compaction-curation --depth=1
          git fetch origin $STACK_BASE --depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply curation refactor and shared fidelity fixes
        run: |
          git show origin/ci/fix-compaction-curation:.github/scripts/fix-compaction-curation-gates.py > /tmp/fix-compaction-curation-gates.py
          git show origin/ci/fix-compaction-curation:.github/scripts/apply-shared-compaction-fidelity-fixes.py > /tmp/apply-shared-compaction-fidelity-fixes.py
          git show origin/ci/fix-compaction-curation:.github/scripts/fix-compaction-semantic-test-runtime.py > /tmp/fix-compaction-semantic-test-runtime.py
          git show origin/ci/fix-compaction-curation:.github/scripts/fix-compaction-unused-exports.py > /tmp/fix-compaction-unused-exports.py
          python /tmp/fix-compaction-curation-gates.py
          python /tmp/apply-shared-compaction-fidelity-fixes.py
          python /tmp/fix-compaction-semantic-test-runtime.py
          python /tmp/fix-compaction-unused-exports.py

      - name: Format changed TypeScript
        run: >-
          pnpm exec oxfmt --write
          src/agents/agent-hooks/compaction-safeguard.ts
          src/agents/agent-hooks/compaction-safeguard-context.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.ts
          src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/agent-hooks/compaction-safeguard-summary-attempt.ts
          src/agents/agent-hooks/compaction-safeguard-active-curation.ts

      - name: Regenerate config metadata
        run: pnpm config:docs:gen

      - name: Prune assertion safety baseline
        run: node --import ./scripts/tsx.mjs scripts/check-assertion-safety-ratchet.mts --prune

      - name: Focused tests
        run: >-
          node scripts/run-vitest.mjs
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/embedded-agent-runner/extensions.test.ts
          src/config/config.compaction-settings.test.ts

      - name: Changed checks
        run: pnpm check:changed --base ${{ env.STACK_BASE }}

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            config/assertion-safety-baseline.txt \
            src/agents/agent-hooks/compaction-safeguard.ts \
            src/agents/agent-hooks/compaction-safeguard-context.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic-judgments.ts \
            src/agents/agent-hooks/compaction-safeguard-semantic.test.ts \
            src/agents/agent-hooks/compaction-safeguard-summary-attempt.ts \
            src/agents/agent-hooks/compaction-safeguard-active-curation.ts \
            docs/.generated/config-baseline.counts.json \
            docs/.generated/config-baseline.sha256
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(compaction): isolate curation summary attempts"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          fi
