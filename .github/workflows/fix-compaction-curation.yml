name: Fix Compaction Curation

on:
  push:
    branches:
      - ci/fix-compaction-curation

permissions:
  contents: write

env:
  NODE_VERSION: "24.x"
  TARGET_BRANCH: feat/judgment-compaction-curation
  STACK_BASE: 4b53a97692a87b0209f83848dd9270f6ee6ca141

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract summary attempt orchestration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/agents/agent-hooks/compaction-safeguard.ts")
          text = path.read_text()

          text = text.replace(
              '  nestRequiredSummaryHeadings,\n  wrapUntrustedInstructionBlock,\n',
              '  nestRequiredSummaryHeadings,\n',
          )
          text = text.replace(
              '  extractMessageText,\n  formatGeneratedSplitTurnSection,\n  formatRequiredAskContext,\n',
              '  extractMessageText,\n  formatRequiredAskContext,\n',
          )
          text = text.replace(
              'import {\n  buildCompactionSemanticSnapshot,\n  projectCompactionSemanticSelection,\n} from "./compaction-safeguard-semantic.js";\n',
              'import { buildCompactionSemanticSnapshot } from "./compaction-safeguard-semantic.js";\n',
          )

          active_import = '''import {
            prepareActiveCompactionCuration,
            prepareCompactionSummaryInput,
            resolveCuratedCompactionCandidate,
          } from "./compaction-safeguard-active-curation.js";
          '''
          summary_import = '''import { createCompactionSummaryAttemptRuntime } from "./compaction-safeguard-summary-attempt.js";
          '''
          if summary_import not in text:
              if active_import not in text:
                  raise SystemExit("active curation import anchor missing")
              text = text.replace(active_import, active_import + summary_import)

          start = text.index('      const summarizePreparedInput = async (params: {')
          end = text.index('      const buildUncuratedSemanticFallback = async', start)
          runtime_block = '''      const summaryAttemptRuntime = createCompactionSummaryAttemptRuntime({
            signal,
            contextWindowTokens,
            turnPrefixMessages,
            isSplitTurn: preparation.isSplitTurn,
            customInstructions,
            structuredInstructions,
            qualityGuardEnabled,
            effectivePreviousSummary,
            identifiers,
            latestUserAsk,
            splitUserAsk,
            latestUnresolvedUserRequest,
            requiredAskContext,
            identifierPolicy,
            summarize: async (request) =>
              await summarizeViaLLM({
                ...llmSummaryParams,
                headers: buildCompactionSummaryHeaders({
                  model,
                  messages: request.messages,
                  headers: authResult.headers,
                }),
                ...request,
              }),
            finalizeSummaryText,
          });
          const {
            summarizePreparedInput,
            auditPreparedSummary,
            buildCorrectiveInstructions,
            buildUncuratedFallback,
          } = summaryAttemptRuntime;

          '''
          text = text[:start] + runtime_block + text[end:]

          fallback_start = text.index('      const buildUncuratedSemanticFallback = async')
          fallback_end = text.index('      const acceptSummary = async', fallback_start)
          fallback_block = '''      const buildUncuratedSemanticFallback = async (): Promise<string | null> => {
            if (!activeCuration.uncuratedMessages) {
              return null;
            }
            const fallback = await buildUncuratedFallback({
              sourceMessages: activeCuration.uncuratedMessages,
              prepareInput: (sourceMessages) =>
                prepareCompactionSummaryInput({
                  sourceMessages,
                  recentTurnsPreserve,
                  qualityGuardEnabled,
                  latestUnresolvedUserRequest,
                  latestUserAsk,
                  requiredAskContext,
                }),
            });
            if (fallback.status !== "ok") {
              log.warn(
                `Compaction semantic uncurated fallback failed: ${fallback.reason}`,
              );
              return null;
            }
            return fallback.summary;
          };

          '''
          text = text[:fallback_start] + fallback_block + text[fallback_end:]

          correction_start = text.index('        const reasons = quality.reasons.join(", ");')
          correction_end = text.index('\n      }\n\n      throw new Error', correction_start)
          correction_block = '''        correctiveInstructions = buildCorrectiveInstructions({
            audit: quality,
            bodyBudget: finalized.bodyBudget,
          });'''
          text = text[:correction_start] + correction_block + text[correction_end:]

          path.write_text(text)
          PY

      - name: Format changed TypeScript
        run: >-
          pnpm exec oxfmt --write
          src/agents/agent-hooks/compaction-safeguard.ts
          src/agents/agent-hooks/compaction-safeguard-summary-attempt.ts
          src/agents/agent-hooks/compaction-safeguard-active-curation.ts

      - name: Regenerate config metadata
        run: pnpm config:docs:gen

      - name: Focused tests
        run: >-
          node scripts/run-vitest.mjs
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/embedded-agent-runner/extensions.test.ts
          src/config/config.compaction-settings.test.ts

      - name: Changed checks
        run: pnpm check:changed --base ${{ env.STACK_BASE }}

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/agents/agent-hooks/compaction-safeguard.ts \
            src/agents/agent-hooks/compaction-safeguard-summary-attempt.ts \
            src/agents/agent-hooks/compaction-safeguard-active-curation.ts \
            docs/.generated/config-baseline.counts.json \
            docs/.generated/config-baseline.sha256
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor(compaction): isolate curation summary attempts"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          fi
