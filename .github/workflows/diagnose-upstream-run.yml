name: Diagnose Upstream PR 103112

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch compact upstream job list and failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "29110884478"
        run: |
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/openclaw/openclaw/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > upstream-jobs.json
          jq -r '.jobs[] | [.id, .name, .status, (.conclusion // "")] | @tsv' \
            upstream-jobs.json > upstream-jobs.tsv
          jq -r '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' \
            upstream-jobs.json > failed-jobs.tsv

          mkdir -p failed-logs
          while IFS=$'\t' read -r job_id job_name; do
            log_path="failed-logs/${job_id}.log"
            if curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/openclaw/openclaw/actions/jobs/${job_id}/logs" \
              --output "${log_path}"; then
              printf '%s\t%s\t%s\n' "${job_id}" "${job_name}" "downloaded" >> log-status.tsv
            else
              printf '%s\t%s\t%s\n' "${job_id}" "${job_name}" "failed" >> log-status.tsv
            fi
          done < failed-jobs.tsv

          cat upstream-jobs.tsv
          echo "Failed jobs:"
          cat failed-jobs.tsv
          echo "Log status:"
          cat log-status.tsv
          test -s failed-jobs.tsv

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-103112-upstream-run-diagnosis
          path: |
            upstream-jobs.tsv
            failed-jobs.tsv
            log-status.tsv
            failed-logs/
          if-no-files-found: warn
