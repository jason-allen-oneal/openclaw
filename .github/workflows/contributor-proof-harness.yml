name: Temporary Contributor Proof Harness

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact contributor PR head SHA
        required: true
        type: string
      proof:
        description: Proof profile
        required: true
        type: choice
        options:
          - recovery
          - windows-filter
          - update-preflight

permissions:
  contents: read

jobs:
  focused-installer-tests:
    if: inputs.proof == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused installer tests
        shell: bash
        run: pnpm exec vitest run test/scripts/install-sh.test.ts test/scripts/install-cli.test.ts --reporter=verbose

  real-posix-rebase-recovery:
    if: inputs.proof == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Exercise real POSIX rebase recovery in both installers
        shell: bash
        run: |
          set -euo pipefail
          run_recovery_case() {
            local script_path="$1"
            (
              set -euo pipefail
              export OPENCLAW_INSTALL_SH_NO_RUN=1
              export OPENCLAW_INSTALL_CLI_SH_NO_RUN=1
              source "$script_path"
              if [[ "$script_path" == "scripts/install.sh" ]]; then
                run_quiet_step() { shift; "$@"; }
              fi

              local tmp remote seed repo expected_head expected_status output status actual_head actual_status
              local rebase_merge rebase_apply
              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT
              remote="$tmp/remote.git"
              seed="$tmp/seed"
              repo="$tmp/repo"
              git init --bare -q "$remote"
              git init -q --initial-branch=main "$seed"
              git -C "$seed" config user.email proof@example.invalid
              git -C "$seed" config user.name proof
              printf 'base\n' > "$seed/state.txt"
              git -C "$seed" add state.txt
              git -C "$seed" commit -qm base
              git -C "$seed" remote add origin "$remote"
              git -C "$seed" push -q -u origin main
              git --git-dir="$remote" symbolic-ref HEAD refs/heads/main
              git clone -q "$remote" "$repo"
              git -C "$repo" config user.email proof@example.invalid
              git -C "$repo" config user.name proof
              printf 'remote\n' > "$seed/state.txt"
              git -C "$seed" commit -qam remote
              git -C "$seed" push -q origin main
              printf 'local\n' > "$repo/state.txt"
              git -C "$repo" commit -qam local
              printf 'keep this user change\n' > "$repo/user-note.txt"
              expected_head="$(git -C "$repo" rev-parse HEAD)"
              expected_status="$(git -C "$repo" status --porcelain=v1 --untracked-files=all)"

              set +e
              output="$(checkout_git_openclaw_ref "$repo" main 2>&1)"
              status=$?
              set -e

              [[ "$status" -ne 0 ]]
              actual_head="$(git -C "$repo" rev-parse HEAD)"
              actual_status="$(git -C "$repo" status --porcelain=v1 --untracked-files=all)"
              rebase_merge="$(git -C "$repo" rev-parse --git-path rebase-merge)"
              rebase_apply="$(git -C "$repo" rev-parse --git-path rebase-apply)"
              [[ "$actual_head" == "$expected_head" ]]
              [[ "$actual_status" == "$expected_status" ]]
              [[ "$(cat "$repo/user-note.txt")" == "keep this user change" ]]
              [[ ! -d "$rebase_merge" && ! -d "$rebase_apply" ]]
              [[ "$output" == *"restored to its pre-update state"* ]]
              printf 'case=%s expected-head=%s restored-head=%s status=%q recovery=head-restored user-change-preserved rebase-state-cleared\n' \
                "$script_path" "$expected_head" "$actual_head" "$actual_status"
            )
          }

          run_recovery_case scripts/install.sh
          run_recovery_case scripts/install-cli.sh
          printf 'real-posix-rebase-recovery=both-installers-verified\n'

  focused-update-preflight-tests:
    if: inputs.proof == 'update-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export COREPACK_HOME="$proof_home/corepack"
          mkdir -p "$HOME" "$COREPACK_HOME"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused updater suite
        shell: bash
        run: pnpm exec vitest run src/infra/update-runner.test.ts --reporter=verbose

  real-windows-preflight-pnpmfile:
    if: inputs.proof == 'update-preflight'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Run real multi-candidate preflight
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$(mktemp -d)"
          export HOME="$proof_home"
          export COREPACK_HOME="$proof_home/corepack"
          mkdir -p "$HOME" "$COREPACK_HOME"
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          node --import tsx/esm --input-type=module <<'NODE'
          import { execFile } from "node:child_process";
          import fs from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { promisify } from "node:util";
          import { runGitDevPreflight } from "./src/infra/update-runner-git-preflight.ts";

          const execFileAsync = promisify(execFile);
          const timeoutMs = 180_000;

          async function runCommand(argv, options = {}) {
            try {
              const executable =
                process.platform === "win32" &&
                ["bun", "corepack", "npm", "pnpm"].includes(argv[0])
                  ? `${argv[0]}.cmd`
                  : argv[0];
              const result = await execFileAsync(executable, argv.slice(1), {
                cwd: options.cwd,
                env: { ...process.env, ...(options.env ?? {}) },
                maxBuffer: 16 * 1024 * 1024,
                timeout: options.timeoutMs ?? timeoutMs,
                shell: process.platform === "win32" && executable.endsWith(".cmd"),
                windowsHide: true,
              });
              return { stdout: String(result.stdout), stderr: String(result.stderr), code: 0 };
            } catch (error) {
              return {
                stdout: String(error.stdout ?? ""),
                stderr: String(error.stderr ?? error.message ?? error),
                code: typeof error.code === "number" ? error.code : 1,
              };
            }
          }

          async function git(cwd, ...args) {
            const result = await runCommand(["git", ...args], { cwd });
            if (result.code !== 0) {
              throw new Error(`git ${args.join(" ")} failed: ${result.stderr}`);
            }
            return result.stdout.trim();
          }

          const fixtureRoot = await fs.mkdtemp(path.join(os.tmpdir(), "openclaw-preflight-pnpmfile-proof-"));
          const remoteRoot = path.join(fixtureRoot, "remote.git");
          const gitRoot = path.join(fixtureRoot, "checkout");
          await git(fixtureRoot, "init", "--bare", remoteRoot);
          await git(fixtureRoot, "init", "--initial-branch=main", gitRoot);
          await git(gitRoot, "config", "user.name", "OpenClaw Proof");
          await git(gitRoot, "config", "user.email", "proof@example.invalid");
          await fs.writeFile(
            path.join(gitRoot, "package.json"),
            JSON.stringify({
              name: "preflight-pnpmfile-proof",
              version: "1.0.0",
              private: true,
              packageManager: "pnpm@11.22.0",
              scripts: { build: "node build.mjs", openclaw: "node config.mjs" },
            }) + "\n",
          );
          await fs.writeFile(path.join(gitRoot, "config.mjs"), "console.log(JSON.stringify({ok:true}));\n");
          const stablePnpmfile = "module.exports = { hooks: require('./pnpmfile-hook.cjs') };\n";
          await fs.writeFile(path.join(gitRoot, "pnpmfile.cjs"), stablePnpmfile);
          await fs.writeFile(
            path.join(gitRoot, "pnpmfile-hook.cjs"),
            "module.exports = { readPackage: (pkg) => ({ ...pkg, version: 'one' }) };\n",
          );
          await fs.writeFile(path.join(gitRoot, "build.mjs"), "console.log('oldest candidate build passed');\n");
          await git(gitRoot, "add", "package.json", "config.mjs", "pnpmfile.cjs", "pnpmfile-hook.cjs", "build.mjs");
          await git(gitRoot, "commit", "-m", "oldest candidate");
          const oldestSha = await git(gitRoot, "rev-parse", "HEAD");

          await fs.writeFile(
            path.join(gitRoot, "pnpmfile-hook.cjs"),
            "module.exports = { readPackage: (pkg) => ({ ...pkg, version: 'two' }) };\n",
          );
          await fs.writeFile(
            path.join(gitRoot, "build.mjs"),
            [
              "import fs from 'node:fs/promises';",
              "const marker = 'node_modules/preflight-mutated.txt';",
              "try { await fs.access(marker); console.error('dependency mutation leaked'); }",
              "catch (error) { if (error.code !== 'ENOENT') throw error; console.log('middle candidate saw clean dependency snapshot'); }",
              "process.exitCode = 1;",
              "",
            ].join("\n"),
          );
          await git(gitRoot, "add", "pnpmfile-hook.cjs", "build.mjs");
          await git(gitRoot, "commit", "-m", "middle candidate with changed imported hook");
          const middleSha = await git(gitRoot, "rev-parse", "HEAD");

          await fs.writeFile(
            path.join(gitRoot, "build.mjs"),
            [
              "import fs from 'node:fs/promises';",
              "await fs.mkdir('node_modules', { recursive: true });",
              "await fs.writeFile('node_modules/preflight-mutated.txt', 'mutated by latest candidate');",
              "console.error('latest candidate mutated dependency tree');",
              "process.exitCode = 1;",
              "",
            ].join("\n"),
          );
          await git(gitRoot, "add", "build.mjs");
          await git(gitRoot, "commit", "-m", "latest candidate");
          const latestSha = await git(gitRoot, "rev-parse", "HEAD");
          await git(gitRoot, "remote", "add", "origin", remoteRoot);
          await git(gitRoot, "push", "--set-upstream", "origin", "main");

          const steps = [];
          const step = (name, argv, cwd, env) => ({
            name,
            argv,
            cwd,
            env,
            timeoutMs,
            runCommand,
            results: steps,
            stepIndex: steps.length,
            totalSteps: 100,
          });
          const result = await runGitDevPreflight({
            gitRoot,
            needsCheckoutMain: true,
            runCommand,
            timeoutMs,
            defaultCommandEnv: process.env,
            steps,
            step,
          });

          const installSteps = steps.filter((entry) => entry.name.startsWith("preflight deps install"));
          const skipped = installSteps.filter((entry) =>
            String(entry.stdoutTail ?? "").trimStart().startsWith("skipped;"),
          );
          const middleBuild = steps.find((entry) => entry.name === `preflight build (${middleSha.slice(0, 8)})`);
          const proof = {
            status: result.status,
            selectedSha: result.selectedSha ?? null,
            candidates: { latestSha, middleSha, oldestSha },
            installs: installSteps.map((entry) => ({
              name: entry.name,
              exitCode: entry.exitCode,
              stdout: entry.stdoutTail ?? "",
            })),
            middleBuild: middleBuild?.stdoutTail ?? middleBuild?.stderrTail ?? null,
            counts: { installSteps: installSteps.length, skipped: skipped.length },
          };
          console.log(JSON.stringify(proof, null, 2));
          if (result.status !== "ok" || result.selectedSha !== oldestSha) {
            throw new Error(`expected oldest candidate to be selected: ${JSON.stringify(proof)}`);
          }
          if (installSteps.length !== 3 || skipped.length !== 0) {
            throw new Error(`expected three real installs and no reuse with an active pnpmfile: ${JSON.stringify(proof)}`);
          }
          if (!middleBuild?.stdoutTail?.includes("middle candidate saw clean dependency snapshot")) {
            throw new Error(`clean candidate state was not observed: ${JSON.stringify(proof)}`);
          }
          console.log("real-windows-preflight=active-pnpmfile-reuse-disabled-and-clean-state-verified");
          NODE

  real-windows-filter-proof:
    if: inputs.proof == 'windows-filter'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install dependencies without lifecycle scripts
        shell: pwsh
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused PowerShell installer tests
        shell: pwsh
        run: pnpm exec vitest run test/scripts/install-ps1.test.ts --reporter=verbose
      - name: Exercise real Git for Windows filtered clone and fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git.exe --version
          node.exe --version

          $source = Get-Content -Raw scripts/install.ps1
          $source = $source -replace '(?ms)\r?\n\$null = Main\r?\nComplete-Install\s*\z', ''
          . ([scriptblock]::Create($source))
          $ErrorActionPreference = 'Continue'

          function Invoke-RealGit {
            param([Parameter(Mandatory = $true)][string[]]$CommandArgs)
            $output = & git.exe @CommandArgs 2>&1
            $status = $LASTEXITCODE
            if ($status -ne 0) {
              throw "git $($CommandArgs -join ' ') failed with exit code ${status}: $($output -join ' ')"
            }
          }

          function Get-RealGitValue {
            param([Parameter(Mandatory = $true)][string[]]$CommandArgs)
            $output = & git.exe @CommandArgs 2>&1
            $status = $LASTEXITCODE
            if ($status -ne 0) {
              throw "git $($CommandArgs -join ' ') failed with exit code ${status}: $($output -join ' ')"
            }
            return ($output | Out-String).Trim()
          }

          $sandbox = Join-Path ([System.IO.Path]::GetTempPath()) ('openclaw-filter-proof-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $sandbox | Out-Null

          function New-LocalRemote {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][bool]$AllowFilter
            )
            $root = Join-Path $sandbox $Name
            $origin = Join-Path $root 'origin.git'
            $seed = Join-Path $root 'seed'
            $filterValue = if ($AllowFilter) { 'true' } else { 'false' }
            New-Item -ItemType Directory -Path $root | Out-Null
            Invoke-RealGit -CommandArgs @('init', '--bare', $origin)
            Invoke-RealGit -CommandArgs @("--git-dir=$origin", 'config', 'uploadpack.allowFilter', $filterValue)
            Invoke-RealGit -CommandArgs @('init', '--initial-branch=main', $seed)
            Invoke-RealGit -CommandArgs @('-C', $seed, 'config', 'user.email', 'proof@example.invalid')
            Invoke-RealGit -CommandArgs @('-C', $seed, 'config', 'user.name', 'proof')
            Set-Content -LiteralPath (Join-Path $seed 'proof.txt') -Value 'proof'
            Invoke-RealGit -CommandArgs @('-C', $seed, 'add', 'proof.txt')
            Invoke-RealGit -CommandArgs @('-C', $seed, 'commit', '-m', 'proof')
            Invoke-RealGit -CommandArgs @('-C', $seed, 'remote', 'add', 'origin', $origin)
            Invoke-RealGit -CommandArgs @('-C', $seed, 'push', '-u', 'origin', 'main')
            Invoke-RealGit -CommandArgs @("--git-dir=$origin", 'symbolic-ref', 'HEAD', 'refs/heads/main')
            return $origin
          }

          try {
            $filterOrigin = New-LocalRemote -Name 'filter' -AllowFilter $true
            $filterTarget = Join-Path $sandbox 'filter-target'
            $filterUrl = 'file:///' + ($filterOrigin -replace '\\', '/')
            New-TransactionalGitCheckout -RepoUrl $filterUrl -RepoDir $filterTarget
            $filterConfig = Get-RealGitValue -CommandArgs @('-C', $filterTarget, 'config', '--get', 'remote.origin.partialclonefilter')
            $filterHead = Get-RealGitValue -CommandArgs @('-C', $filterTarget, 'rev-parse', 'HEAD')
            if ($filterConfig -ne 'blob:none') { throw "filtered clone config was '$filterConfig'" }
            if (-not (Test-Path -LiteralPath (Join-Path $filterTarget 'proof.txt'))) { throw 'filtered clone did not materialize proof.txt' }
            Write-Output "filtered-clone=completed partialclonefilter=$filterConfig head=$filterHead"

            $fallbackOrigin = New-LocalRemote -Name 'fallback' -AllowFilter $false
            $fallbackTarget = Join-Path $sandbox 'fallback-target'
            $fallbackUrl = 'file:///' + ($fallbackOrigin -replace '\\', '/')
            $global:RealGitPath = (Get-Command git.exe).Source
            $global:FallbackCloneArgs = @()
            function global:git {
              $commandArgs = @($args)
              if ($commandArgs.Count -ge 2 -and $commandArgs[0] -eq 'clone' -and $commandArgs[1] -eq '-h') {
                $global:FallbackCloneArgs = $commandArgs
                Write-Output 'usage: git clone [options]'
                $global:LASTEXITCODE = 129
                return
              }
              if ($commandArgs.Count -gt 0 -and $commandArgs[0] -eq 'clone') {
                $global:FallbackCloneArgs = $commandArgs
              }
              & $global:RealGitPath @commandArgs
              $status = $LASTEXITCODE
              $global:LASTEXITCODE = $status
            }
            New-TransactionalGitCheckout -RepoUrl $fallbackUrl -RepoDir $fallbackTarget
            $fallbackHead = Get-RealGitValue -CommandArgs @('-C', $fallbackTarget, 'rev-parse', 'HEAD')
            if ($global:FallbackCloneArgs -contains '--filter=blob:none') { throw 'fallback clone received a filter argument' }
            if (-not (Test-Path -LiteralPath (Join-Path $fallbackTarget 'proof.txt'))) { throw 'fallback clone did not materialize proof.txt' }
            Write-Output "fallback-clone=completed args=$($global:FallbackCloneArgs -join ' ') head=$fallbackHead"
            Write-Output 'real-windows-filter-proof=filtered-clone-and-compatible-fallback-verified'
          } finally {
            Remove-Item -LiteralPath $sandbox -Recurse -Force -ErrorAction SilentlyContinue
          }
