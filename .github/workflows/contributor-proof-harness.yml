name: Temporary Contributor Proof Harness

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact contributor PR head SHA
        required: true
        type: string
      proof:
        description: Proof profile
        required: true
        type: choice
        options:
          - recovery
          - windows-filter
          - update-preflight
          - preference-policy
          - runtime-build-identity
          - binding-resume

permissions:
  contents: read

jobs:
  focused-installer-tests:
    if: inputs.proof == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jason-allen-oneal/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused installer tests
        shell: bash
        run: pnpm exec vitest run test/scripts/install-sh.test.ts test/scripts/install-cli.test.ts --reporter=verbose

  focused-preference-policy-tests:
    if: inputs.proof == 'preference-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jason-allen-oneal/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export COREPACK_HOME="$proof_home/corepack"
          mkdir -p "$HOME" "$COREPACK_HOME"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused preference-policy tests
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export XDG_CONFIG_HOME="$proof_home/xdg"
          export COREPACK_HOME="$proof_home/corepack"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$COREPACK_HOME"
          pnpm exec vitest run test/scripts/install-sh.test.ts test/scripts/install-cli.test.ts \
            -t "preserves explicit pnpm prefer-offline settings" --reporter=verbose
          ! grep -Eq 'prefer\[-_\]offline' scripts/install.sh scripts/install-cli.sh
          grep -Eq 'npm_config_has_raw_key .*"prefer-offline"' scripts/install.sh scripts/install-cli.sh
          printf 'preference-policy=canonical-npmrc-key-and-env-spellings-verified\n'

  focused-updater-preference-proof:
    if: inputs.proof == 'preference-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jason-allen-oneal/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export XDG_CONFIG_HOME="$proof_home/xdg"
          export COREPACK_HOME="$proof_home/corepack"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$COREPACK_HOME"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused updater precedence tests
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export XDG_CONFIG_HOME="$proof_home/xdg"
          export COREPACK_HOME="$proof_home/corepack"
          pnpm exec vitest run src/infra/update-runner.test.ts \
            -t "uses pnpm highest resolution mode for (update|dev preflight) installs|preserves explicit .* in update installs|preserves an explicit (project|user) npmrc prefer-offline setting" \
            --reporter=verbose
          printf 'updater-precedence=default-env-project-and-user-overrides-verified\n'
      - name: Run real redacted Git-preflight preference trace
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export XDG_CONFIG_HOME="$proof_home/xdg"
          export COREPACK_HOME="$proof_home/corepack"
          unset PNPM_CONFIG_PREFER_OFFLINE pnpm_config_prefer_offline
          node --import tsx/esm --input-type=module <<'NODE'
          import { execFile } from "node:child_process";
          import fs from "node:fs/promises";
          import os from "node:os";
          import path from "node:path";
          import { promisify } from "node:util";
          import { runGitDevPreflight } from "./src/infra/update-runner-git-preflight.ts";

          const execFileAsync = promisify(execFile);
          const timeoutMs = 180_000;

          async function runCase(label, npmrc) {
            const fixtureRoot = await fs.mkdtemp(path.join(os.tmpdir(), "openclaw-preference-proof-"));
            const gitRoot = path.join(fixtureRoot, "checkout");
            const caseHome = path.join(fixtureRoot, "home");
            await fs.mkdir(caseHome, { recursive: true });
            const installTraces = [];
            try {
              async function runCommand(argv, options = {}) {
                if (argv[0] === "pnpm" && argv[1] === "install") {
                  installTraces.push({
                    command: argv.join(" "),
                    upper: options.env?.PNPM_CONFIG_PREFER_OFFLINE ?? null,
                    lower: options.env?.pnpm_config_prefer_offline ?? null,
                  });
                }
                try {
                  const result = await execFileAsync(argv[0], argv.slice(1), {
                    cwd: options.cwd,
                    env: { ...process.env, ...(options.env ?? {}) },
                    maxBuffer: 16 * 1024 * 1024,
                    timeout: options.timeoutMs ?? timeoutMs,
                  });
                  return { stdout: String(result.stdout), stderr: String(result.stderr), code: 0 };
                } catch (error) {
                  return {
                    stdout: String(error.stdout ?? ""),
                    stderr: String(error.stderr ?? error.message ?? error),
                    code: typeof error.code === "number" ? error.code : 1,
                  };
                }
              }

              async function git(...args) {
                const result = await runCommand(["git", ...args], { cwd: fixtureRoot });
                if (result.code !== 0) {
                  throw new Error(`git ${args.join(" ")} failed: ${result.stderr}`);
                }
                return result.stdout.trim();
              }

              await git("init", "--initial-branch=main", gitRoot);
              await git("-C", gitRoot, "config", "user.name", "OpenClaw Proof");
              await git("-C", gitRoot, "config", "user.email", "proof@example.invalid");
              await fs.writeFile(
                path.join(gitRoot, "package.json"),
                JSON.stringify({
                  name: "preflight-preference-proof",
                  version: "1.0.0",
                  private: true,
                  packageManager: "pnpm@11.22.0",
                  scripts: {
                    build: "node build.mjs",
                    openclaw: "node config.mjs",
                  },
                }) + "\n",
              );
              await fs.writeFile(path.join(gitRoot, "build.mjs"), "console.log('build=ok');\n");
              await fs.writeFile(
                path.join(gitRoot, "config.mjs"),
                "console.log(JSON.stringify({ok:true}));\n",
              );
              if (npmrc !== null) {
                await fs.writeFile(path.join(gitRoot, ".npmrc"), npmrc);
              }
              await git("-C", gitRoot, "add", ".");
              await git("-C", gitRoot, "commit", "-m", label);
              const targetSha = await git("-C", gitRoot, "rev-parse", "HEAD");

              const steps = [];
              const step = (name, argv, cwd, env) => ({
                name,
                argv,
                cwd,
                env,
                timeoutMs,
                runCommand,
                results: steps,
                stepIndex: steps.length,
                totalSteps: 100,
              });
              const defaultCommandEnv = {
                PATH: process.env.PATH,
                HOME: caseHome,
                XDG_CONFIG_HOME: path.join(caseHome, "xdg"),
                COREPACK_HOME: process.env.COREPACK_HOME,
                CI: "true",
              };
              const result = await runGitDevPreflight({
                gitRoot,
                devTarget: { mode: "detached", ref: targetSha },
                needsCheckoutMain: false,
                runCommand,
                timeoutMs,
                defaultCommandEnv,
                steps,
                step,
              });
              if (result.status !== "ok" || result.selectedSha !== targetSha) {
                throw new Error(`preflight ${label} failed: ${JSON.stringify(result)}`);
              }
              if (installTraces.length !== 1) {
                throw new Error(`expected one install trace for ${label}: ${JSON.stringify(installTraces)}`);
              }
              const trace = installTraces[0];
              const expected = npmrc === null ? "true" : null;
              if (trace.upper !== expected || trace.lower !== expected) {
                throw new Error(`unexpected preference trace for ${label}: ${JSON.stringify(trace)}`);
              }
              console.log(JSON.stringify({
                case: label,
                status: result.status,
                installCommand: trace.command,
                injectedUpper: trace.upper,
                injectedLower: trace.lower,
              }));
            } finally {
              await fs.rm(fixtureRoot, { recursive: true, force: true });
            }
          }

          await runCase("default", null);
          await runCase("project-npmrc-false", "prefer-offline=false\n");
          console.log("git-preflight-trace=default-added-explicit-project-setting-preserved");
          console.log("transcript=redacted-no-paths-no-credentials");
          NODE

  real-preference-policy-source-install:
    if: inputs.proof == 'preference-policy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jason-allen-oneal/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Run real source-install preference transcript
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export XDG_CONFIG_HOME="$proof_home/xdg"
          export COREPACK_HOME="$proof_home/corepack"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$COREPACK_HOME"
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          real_pnpm="$(command -v pnpm)"
          pnpm_bin="$tmp/pnpm"
          pnpm_log="$tmp/pnpm.log"
          store_dir="$tmp/store"
          cat >"$pnpm_bin" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'pnpm argv:' >> "$PNPM_PROOF_LOG"
          printf ' %q' "$@" >> "$PNPM_PROOF_LOG"
          printf '\n' >> "$PNPM_PROOF_LOG"
          if [[ "${1:-}" == "--version" ]]; then
            exec "$PNPM_PROOF_REAL" "$@"
          fi
          exec "$PNPM_PROOF_REAL" "$@" --store-dir "$PNPM_PROOF_STORE" --reporter=append-only
          SH
          chmod +x "$pnpm_bin"
          export PNPM_PROOF_LOG="$pnpm_log"
          export PNPM_PROOF_REAL="$real_pnpm"
          export PNPM_PROOF_STORE="$store_dir"
          export PATH="$tmp:$PATH"

          run_source_install() {
            local project_dir="$1"
            local output_log="$2"
            (
              set -euo pipefail
              export OPENCLAW_INSTALL_SH_NO_RUN=1
              source scripts/install.sh
              ensure_pnpm() { set_pnpm_cmd "$PNPM_PROOF_BIN"; }
              ensure_pnpm_binary_for_scripts() { :; }
              check_git() { return 0; }
              validate_git_checkout_head() { return 0; }
              cleanup_legacy_submodules() { :; }
              activate_repo_pnpm_version() { :; }
              resolve_git_openclaw_ref() { printf 'main\n'; }
              checkout_git_openclaw_ref() { :; }
              git_install_lockfile_flag() { printf '%s\n' '--no-frozen-lockfile'; }
              ensure_user_local_bin_on_path() { :; }
              publish_executable_wrapper() { cat >/dev/null; }
              run_quiet_step() {
                local title="$1"
                shift
                printf 'source-install-step=%s\n' "$title"
                if [[ "$title" == "Installing dependencies" ]]; then
                  "$@"
                fi
              }
              install_openclaw_from_git "$project_dir"
            ) >"$output_log" 2>&1
          }

          export PNPM_PROOF_BIN="$pnpm_bin"
          make_project() {
            local project_dir="$1"
            mkdir -p "$project_dir/dist"
            git init -q --initial-branch=main "$project_dir"
            git -C "$project_dir" config user.name proof
            git -C "$project_dir" config user.email proof@example.invalid
            printf '{"name":"preference-proof","version":"1.0.0","private":true,"dependencies":{"is-number":"7.0.0"}}\n' >"$project_dir/package.json"
            printf 'process.exit(0);\n' >"$project_dir/dist/entry.js"
            git -C "$project_dir" add package.json dist/entry.js
            git -C "$project_dir" commit -qm fixture
          }

          default_project="$tmp/default-project"
          make_project "$default_project"
          default_log="$tmp/default-install.log"
          run_source_install "$default_project" "$default_log"
          default_install_line="$(grep 'pnpm argv: .* install ' "$pnpm_log" | head -n 1)"
          [[ "$default_install_line" == *"--prefer-offline"* ]]
          grep -Eq 'downloaded [1-9][0-9]*' "$default_log"
          test -d "$default_project/node_modules/is-number"

          rm -rf "$default_project/node_modules"
          : >"$pnpm_log"
          cached_log="$tmp/cached-install.log"
          run_source_install "$default_project" "$cached_log"
          cached_install_line="$(grep 'pnpm argv: .* install ' "$pnpm_log" | head -n 1)"
          [[ "$cached_install_line" == *"--prefer-offline"* ]]
          grep -Eq 'reused [1-9][0-9]*' "$cached_log"
          test -d "$default_project/node_modules/is-number"

          explicit_project="$tmp/explicit-false-project"
          make_project "$explicit_project"
          printf 'prefer-offline=false\n' >"$explicit_project/.npmrc"
          explicit_log="$tmp/explicit-false-install.log"
          : >"$pnpm_log"
          run_source_install "$explicit_project" "$explicit_log"
          explicit_install_line="$(grep 'pnpm argv: .* install ' "$pnpm_log" | head -n 1)"
          [[ "$explicit_install_line" != *"--prefer-offline"* ]]
          test -d "$explicit_project/node_modules/is-number"

          redact_tmp() { sed "s#${tmp}#<proof-tmp>#g"; }
          printf 'transcript-default-command=%s\n' "$default_install_line" | redact_tmp
          printf 'transcript-default-result=%s\n' "$(grep 'Progress:.*downloaded' "$default_log" | tail -n 1)"
          printf 'transcript-cached-command=%s\n' "$cached_install_line" | redact_tmp
          printf 'transcript-cached-result=%s\n' "$(grep 'Progress:.*reused' "$cached_log" | tail -n 1)"
          printf 'transcript-explicit-false-command=%s\n' "$explicit_install_line" | redact_tmp
          printf 'source-install=install.sh exact-head=%s\n' "$(git rev-parse HEAD)"
          printf 'online-fallback=missing-package-downloaded-from-registry\n'
          printf 'cache-preference=prefer-offline-observed-on-source-install\n'
          printf 'cache-reuse=cached-package-reused-on-repeat-install\n'
          printf 'explicit-false=.npmrc-prefer-offline-false-omitted-the-flag\n'
          printf 'transcript=redacted-no-credentials\n'

  focused-runtime-build-tests:
    if: inputs.proof == 'runtime-build-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jason-allen-oneal/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/proof-home"
          export HOME="$proof_home"
          export COREPACK_HOME="$proof_home/corepack"
          mkdir -p "$HOME" "$COREPACK_HOME"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run focused runtime identity tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            src/cli/daemon-cli/restart-health.test.ts \
            src/cli/update-cli/update-command-service.test.ts \
            src/infra/update-runner.test.ts \
            src/gateway/server/ws-connection/connect-hello.update-scope.test.ts \
            -t "build identity|Git identity|Gateway runtime build|reports Gateway build" \
            --reporter=verbose
          printf 'runtime-identity-tests=dev-scope-and-configured-root-regressions-verified\n'

  real-runtime-build-identity:
    if: inputs.proof == 'runtime-build-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jason-allen-oneal/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Exercise configured-root runtime identity against a real gateway
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/proof-home"
          export COREPACK_HOME="$RUNNER_TEMP/proof-corepack"
          export OPENCLAW_STATE_DIR="$RUNNER_TEMP/proof-state"
          configured_root="$RUNNER_TEMP/configured-control-ui"
          mkdir -p "$HOME" "$COREPACK_HOME" "$OPENCLAW_STATE_DIR" "$configured_root"
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          build_id="$(node -p "require('./dist/build-info.json').buildId")"
          token=proof-token
          node --input-type=module - "$OPENCLAW_STATE_DIR/openclaw.json" "$token" "$configured_root" <<'NODE'
          const [configPath, token, controlUiRoot] = process.argv.slice(2);
          const fs = await import("node:fs/promises");
          await fs.writeFile(
            configPath,
            JSON.stringify({
              gateway: {
                mode: "local",
                auth: { mode: "token", token },
                controlUi: { root: controlUiRoot },
              },
            }) + "\n",
          );
          NODE
          port=19093
          node dist/entry.js gateway run --bind loopback --port "$port" --token "$token" >"$RUNNER_TEMP/configured-gateway.log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if node -e "const net=require('net'); const s=net.connect($port,'127.0.0.1'); s.on('connect',()=>{s.destroy();process.exit(0)}); s.on('error',()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          [[ "$ready" -eq 1 ]]
          test -s "$RUNNER_TEMP/configured-gateway.log"
          node --import tsx/esm --input-type=module - "$port" "$build_id" "$token" <<'NODE'
          import { inspectGatewayRestart } from "./src/cli/daemon-cli/restart-health.ts";
          import { renderRestartDiagnostics } from "./src/cli/daemon-cli/restart-health-diagnostics.ts";
          import { GatewayClient } from "./packages/gateway-client/src/index.ts";
          import {
            GATEWAY_CLIENT_MODES,
            GATEWAY_CLIENT_NAMES,
          } from "./packages/gateway-protocol/src/client-info.ts";

          const [port, buildId, token] = process.argv.slice(2);
          const hello = await new Promise((resolve, reject) => {
            let settled = false;
            let client;
            const finish = (callback, value) => {
              if (settled) {
                return;
              }
              settled = true;
              callback(value);
            };
            client = new GatewayClient({
              url: `ws://127.0.0.1:${port}`,
              token,
              deviceIdentity: null,
              clientName: GATEWAY_CLIENT_NAMES.CLI,
              clientVersion: "proof",
              mode: GATEWAY_CLIENT_MODES.PROBE,
              scopes: ["operator.read"],
              onHelloOk: (payload) => {
                client.stop();
                finish(resolve, payload);
              },
              onConnectError: (error) => finish(reject, error),
            });
            client.start();
          });
          if (hello?.server?.controlUiBuildSource !== "configured") {
            throw new Error("expected configured Control UI source: " + JSON.stringify(hello));
          }
          const service = {
            label: "proof",
            loadedText: "loaded",
            notLoadedText: "not loaded",
            stage: async () => {},
            install: async () => {},
            uninstall: async () => {},
            start: async () => {},
            stop: async () => {},
            restart: async () => ({}),
            isLoaded: async () => true,
            readCommand: async () => null,
            readRuntime: async () => ({ status: "unknown" }),
          };
          const probe = async (expectedBuildId) =>
            await inspectGatewayRestart({
              service,
              port: Number(port),
              env: {},
              expectedBuildId,
              probeAuth: { token },
              probeHosts: ["127.0.0.1"],
            });

          const stale = await probe("stale-configured-build");
          if (stale.healthy || !stale.buildIdMismatch) {
            throw new Error("expected stale configured-root mismatch: " + JSON.stringify(stale));
          }
          const diagnostic = renderRestartDiagnostics(stale);
          if (!diagnostic.some((line) => line.includes("Gateway build mismatch"))) {
            throw new Error("missing mismatch diagnostic: " + diagnostic);
          }
          const fresh = await probe(buildId);
          if (!fresh.healthy) {
            throw new Error("expected fresh configured-root health: " + JSON.stringify(fresh));
          }
          console.log(
            "configured-ui-source=reported\nconfigured-stale-diagnostic=verified\nconfigured-fresh-health=verified\nbuild-id=" +
              buildId,
          );
          NODE

  real-posix-rebase-recovery:
    if: inputs.proof == 'recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jason-allen-oneal/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Exercise real POSIX rebase recovery in both installers
        shell: bash
        run: |
          set -euo pipefail
          run_recovery_case() {
            local script_path="$1"
            (
              set -euo pipefail
              export OPENCLAW_INSTALL_SH_NO_RUN=1
              export OPENCLAW_INSTALL_CLI_SH_NO_RUN=1
              source "$script_path"
              if [[ "$script_path" == "scripts/install.sh" ]]; then
                run_quiet_step() { shift; "$@"; }
              fi

              local tmp remote seed repo expected_head expected_status output status actual_head actual_status
              local rebase_merge rebase_apply
              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT
              remote="$tmp/remote.git"
              seed="$tmp/seed"
              repo="$tmp/repo"
              git init --bare -q "$remote"
              git init -q --initial-branch=main "$seed"
              git -C "$seed" config user.email proof@example.invalid
              git -C "$seed" config user.name proof
              printf 'base\n' > "$seed/state.txt"
              git -C "$seed" add state.txt
              git -C "$seed" commit -qm base
              git -C "$seed" remote add origin "$remote"
              git -C "$seed" push -q -u origin main
              git --git-dir="$remote" symbolic-ref HEAD refs/heads/main
              git clone -q "$remote" "$repo"
              git -C "$repo" config user.email proof@example.invalid
              git -C "$repo" config user.name proof
              printf 'remote\n' > "$seed/state.txt"
              git -C "$seed" commit -qam remote
              git -C "$seed" push -q origin main
              printf 'local\n' > "$repo/state.txt"
              git -C "$repo" commit -qam local
              printf 'keep this user change\n' > "$repo/user-note.txt"
              expected_head="$(git -C "$repo" rev-parse HEAD)"
              expected_status="$(git -C "$repo" status --porcelain=v1 --untracked-files=all)"

              set +e
              output="$(checkout_git_openclaw_ref "$repo" main 2>&1)"
              status=$?
              set -e

              [[ "$status" -ne 0 ]]
              actual_head="$(git -C "$repo" rev-parse HEAD)"
              actual_status="$(git -C "$repo" status --porcelain=v1 --untracked-files=all)"
              rebase_merge="$(git -C "$repo" rev-parse --git-path rebase-merge)"
              rebase_apply="$(git -C "$repo" rev-parse --git-path rebase-apply)"
              [[ "$actual_head" == "$expected_head" ]]
              [[ "$actual_status" == "$expected_status" ]]
              [[ "$(cat "$repo/user-note.txt")" == "keep this user change" ]]
              [[ ! -d "$rebase_merge" && ! -d "$rebase_apply" ]]
              [[ "$output" == *"restored to its pre-update state"* ]]
              printf 'case=%s expected-head=%s restored-head=%s status=%q recovery=head-restored user-change-preserved rebase-state-cleared\n' \
                "$script_path" "$expected_head" "$actual_head" "$actual_status"
            )
          }

          run_recovery_case scripts/install.sh
          run_recovery_case scripts/install-cli.sh
          printf 'real-posix-rebase-recovery=both-installers-verified\n'

          run_ref_collision_case() {
            local script_path="$1"
            (
              set -euo pipefail
              export OPENCLAW_INSTALL_SH_NO_RUN=1
              export OPENCLAW_INSTALL_CLI_SH_NO_RUN=1
              source "$script_path"
              if [[ "$script_path" == "scripts/install.sh" ]]; then
                run_quiet_step() { shift; "$@"; }
              fi

              local tmp remote seed repo ref tag_head branch_head selected
              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT
              remote="$tmp/remote.git"
              seed="$tmp/seed"
              repo="$tmp/repo"
              ref=v2026.5.12
              git init --bare -q "$remote"
              git init -q --initial-branch=main "$seed"
              git -C "$seed" config user.email proof@example.invalid
              git -C "$seed" config user.name proof
              printf 'tag\n' > "$seed/state.txt"
              git -C "$seed" add state.txt
              git -C "$seed" commit -qm tag
              tag_head="$(git -C "$seed" rev-parse HEAD)"
              git -C "$seed" remote add origin "$remote"
              git -C "$seed" push -q -u origin main
              git --git-dir="$remote" symbolic-ref HEAD refs/heads/main
              git -C "$seed" tag "$ref"
              git -C "$seed" push -q origin "refs/tags/$ref"
              git -C "$seed" checkout -qb "$ref"
              printf 'branch\n' > "$seed/state.txt"
              git -C "$seed" commit -qam branch
              branch_head="$(git -C "$seed" rev-parse HEAD)"
              git -C "$seed" push -q origin "refs/heads/$ref"
              git clone -q "$remote" "$repo"
              checkout_git_openclaw_ref "$repo" "$ref"
              selected="$(git -C "$repo" rev-parse HEAD)"
              [[ "$selected" == "$tag_head" && "$selected" != "$branch_head" ]]
              [[ "$GIT_REF_KIND" == "immutable" ]]
              printf 'case=%s selected=%s tag=%s branch=%s kind=%s\n' \
                "$script_path" "$selected" "$tag_head" "$branch_head" "$GIT_REF_KIND"
            )
          }

          run_ref_collision_case scripts/install.sh
          run_ref_collision_case scripts/install-cli.sh
          printf 'real-posix-ref-collision=both-installers-release-tag-preferred\n'

          run_ref_branch_fallback_case() {
            local script_path="$1"
            (
              set -euo pipefail
              export OPENCLAW_INSTALL_SH_NO_RUN=1
              export OPENCLAW_INSTALL_CLI_SH_NO_RUN=1
              source "$script_path"
              if [[ "$script_path" == "scripts/install.sh" ]]; then
                run_quiet_step() { shift; "$@"; }
              fi

              local tmp remote seed repo ref branch_head selected
              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT
              remote="$tmp/remote.git"
              seed="$tmp/seed"
              repo="$tmp/repo"
              ref=v2-hotfix
              git init --bare -q "$remote"
              git init -q --initial-branch=main "$seed"
              git -C "$seed" config user.email proof@example.invalid
              git -C "$seed" config user.name proof
              printf 'base\n' > "$seed/state.txt"
              git -C "$seed" add state.txt
              git -C "$seed" commit -qm base
              git -C "$seed" remote add origin "$remote"
              git -C "$seed" push -q -u origin main
              git -C "$seed" checkout -qb "$ref"
              printf 'branch\n' > "$seed/state.txt"
              git -C "$seed" commit -qam branch
              branch_head="$(git -C "$seed" rev-parse HEAD)"
              git -C "$seed" push -q origin "refs/heads/$ref"
              git clone -q "$remote" "$repo"
              checkout_git_openclaw_ref "$repo" "$ref"
              selected="$(git -C "$repo" rev-parse HEAD)"
              [[ "$selected" == "$branch_head" ]]
              [[ "$GIT_REF_KIND" == "moving" ]]
              printf 'case=%s selected=%s branch=%s kind=%s\n' \
                "$script_path" "$selected" "$branch_head" "$GIT_REF_KIND"
            )
          }

          run_ref_branch_fallback_case scripts/install.sh
          run_ref_branch_fallback_case scripts/install-cli.sh
          printf 'real-posix-v-prefixed-branch-fallback=both-installers-verified\n'

