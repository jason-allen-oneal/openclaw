name: Verify Compaction Fidelity Final

on:
  push:
    branches:
      - ci/verify-compaction-fidelity-final

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"
  TARGET_BRANCH: feat/judgment-compaction-fidelity
  STACK_BASE: d220d8c5c1a1a100374715626b5c4419855e490c

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate config metadata
        run: pnpm config:docs:check

      - name: Focused tests
        run: >-
          node scripts/run-vitest.mjs
          src/agents/agent-hooks/compaction-safeguard-semantic.test.ts
          src/agents/embedded-agent-runner/extensions.test.ts
          src/config/config.compaction-settings.test.ts

      - name: Changed checks
        run: pnpm check:changed --base ${{ env.STACK_BASE }}
