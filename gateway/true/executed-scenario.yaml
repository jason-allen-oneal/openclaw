title: Built Gateway DM completion fallback true
scenario:
  id: dm-completion-runtime-true
  surface: subagents
  coverage:
    primary:
      - agent-runtime.subagent-turns-delivery
    secondary:
      - agent-runtime.subagent-turns-subagents
      - channels.qa-channel-final-reply
  objective: Prove visible, silent, restart-recovered, and sanitized
    direct-fallback subagent completion behavior through real QA channel
    ingress.
  gatewayConfigPatch:
    tools:
      alsoAllow:
        - message
    agents:
      entries:
        qa:
          tools:
            alsoAllow:
              - message
  successCriteria:
    - Visible completion output reaches the originating QA DM exactly once.
    - Exact worker NO_REPLY stays private while required parent completion
      represents missing child output visibly exactly once.
    - Gateway restart does not replay prior terminal payloads or synthesize
      interruption notices for already-settled handoffs, and a post-restart
      completion is delivered exactly once.
    - Direct fallback strips protected internal metadata before one channel
      delivery.
    - A private parent consumes a child-only nonce and media reference, spawns a
      second child with messaging denied, records its reviewed outcome
      internally, and does not send or replay either result on the channel.
  docsRefs:
    - docs/tools/subagents.md
    - docs/help/testing.md
    - docs/channels/qa-channel.md
  codeRefs:
    - extensions/qa-lab/src/execution-identity-storage-inspection.ts
    - src/agents/agent-run-terminal-reply.ts
    - src/agents/subagents/announce/subagent-announce-delivery.ts
    - src/agents/subagents/registry/subagent-registry-lifecycle.ts
    - extensions/qa-lab/src/providers/mock-openai/server.ts
  execution:
    kind: flow
    providerMode: mock-openai
    retryCount: 0
    summary: Exercise terminal-reply dispositions through mock provider, ephemeral
      Gateway, native subagent state, and qa-channel capture.
    config:
      requiredProviderMode: mock-openai
      cases:
        - name: fallback
          marker: QA-SUBAGENT-TERMINAL-FALLBACK-OK
          expectedSendCount: 1
      restartMarker: QA-SUBAGENT-TERMINAL-RESTART-OK
      metadataSentinel: QA-SUBAGENT-TERMINAL-INTERNAL-MUST-NOT-LEAK
      parentAcknowledgment: Worker started.
flow:
  steps:
    - name: proves terminal-reply channel behavior including restart recovery
      actions:
        - set: publishTerminalDiagnostic
          value:
            lambda:
              params:
                - artifact
              async: true
              expr: >
                (async () => {
                  const { publishQaSuiteArtifactFiles } = await qaImport('./suite-artifacts.js');
                  const { redactQaGatewayDebugText } = await qaImport('./gateway-log-redaction.js');
                  const filePath = path.join(env.outputDir, 'subagent-terminal-diagnostic.json');
                  const content = redactQaGatewayDebugText(JSON.stringify(artifact));
                  await publishQaSuiteArtifactFiles({ outputDir: env.outputDir, files: [{ filePath, content }] });
                  if (await fs.readFile(filePath, 'utf8') !== content) throw new Error('Terminal diagnostic readback mismatch');
                  return { artifact: path.basename(filePath), captureStage: artifact.captureStage };
                })()
        - set: snapshotTerminalRequests
          value:
            lambda:
              params:
                - requests
              expr: >
                requests.map(request => {
                  const bounded = (value, limit) => {
                    const json = JSON.stringify(value);
                    return json === undefined ? null : json.length > limit ? { omitted: true, serializedCharacters: json.length } : value;
                  };
                  return {
                    cursor: request.cursor, sessionId: request.sessionId, body: bounded(request.body, 262144),
                    prompt: bounded(request.prompt, 32768), toolOutput: bounded(request.toolOutput, 32768),
                    requestKind: request.requestKind, outcome: request.outcome, errorCode: request.errorCode,
                    plannedToolName: request.plannedToolName, plannedWireToolName: request.plannedWireToolName,
                    plannedToolArgs: bounded(request.plannedToolArgs, 32768), plannedToolCallId: request.plannedToolCallId,
                    plannedToolItemId: request.plannedToolItemId, toolOutputCallId: request.toolOutputCallId
                  };
                })
        - set: diagnosticPreflight
          value:
            expr: "await publishTerminalDiagnostic({ captureStage: 'preflight', scenarioId:
              'subagent-completion-direct-fallback' })"
        - set: activePhase
          value: bootstrap
        - set: suiteRequestCursor
          value:
            expr: (await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor
        - set: activeRequestCursor
          value:
            ref: suiteRequestCursor
        - set: suiteEventCursor
          value:
            expr: state.getSnapshot().cursor
        - try:
            actions:
              - assert:
                  expr: env.providerMode === config.requiredProviderMode
                  message:
                    expr: "`expected provider mode ${config.requiredProviderMode}, got
                      ${env.providerMode}`"
              - call: waitForGatewayHealthy
                args:
                  - ref: env
                  - 120000
              - call: waitForQaChannelReady
                args:
                  - ref: env
                  - 120000
              - set: verdicts
                value:
                  expr: "[]"
              - set: directFallbackProofs
                value:
                  expr: "[]"
              - set: readSettledTerminalRun
                value:
                  lambda:
                    params:
                      - caseName
                    async: true
                    expr: (await readNativeQaSubagentRuns(env)).find((run) => run.label ===
                      `qa-terminal-${caseName}` && run.execution.status ===
                      'terminal' && run.execution.outcome?.status === 'ok' &&
                      run.delivery?.status === 'delivered')
              - set: readDirectFallbackReceipts
                value:
                  lambda:
                    params:
                      - run
                    async: true
                    expr: "(await env.gateway.call('chat.history', { agentId: 'qa', sessionKey:
                      run.requesterSessionKey, limit: 100, maxChars: 20000 }, {
                      timeoutMs: 10000 })).messages?.filter((message) =>
                      message.role === 'assistant' && message.provider ===
                      'openclaw' && message.model === 'delivery-mirror' &&
                      message.__openclaw?.idempotencyKey ===
                      `announce:v1:${run.childSessionKey}:${run.runId}:text-dir\
                      ect`) ?? []"
              - forEach:
                  items:
                    expr: config.cases
                  item: terminalCase
                  actions:
                    - set: activePhase
                      value:
                        expr: "`public:${terminalCase.name}`"
                    - set: startIndex
                      value:
                        expr: state.getSnapshot().messages.length
                    - set: requestCursor
                      value:
                        expr: "env.mock ? (await
                          fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).\
                          cursor : 0"
                    - set: activeRequestCursor
                      value:
                        ref: requestCursor
                    - set: conversationId
                      value:
                        expr: "`terminal-${terminalCase.name}-${randomUUID().slice(0, 8)}`"
                    - sendInbound:
                        accountId: default
                        conversation:
                          id:
                            ref: conversationId
                          kind: direct
                        senderId:
                          ref: conversationId
                        senderName: QA Terminal Reply Operator
                        text:
                          expr: "`Subagent terminal reply QA check: ${terminalCase.name}. Spawn one native
                            worker, then finish the parent turn without waiting.
                            Do not use ACP.`"
                    - call: waitForCondition
                      saveAs: terminalRun
                      args:
                        - lambda:
                            async: true
                            expr: >
                              (async () => {
                                await env.mock?.terminalRequesters?.settle(env.gateway);
                                const run = await readSettledTerminalRun(terminalCase.name);
                                if (!run) return undefined;
                                if (terminalCase.name !== 'silent' && (await readDirectFallbackReceipts(run)).length === 0) return undefined;
                                const outbound = state.getSnapshot().messages.slice(startIndex).filter((candidate) => candidate.direction === 'outbound' && candidate.conversation.id === conversationId);
                                if (!outbound.some((candidate) => !candidate.deleted && String(candidate.text ?? '').trim() === config.parentAcknowledgment)) return undefined;
                                const matchingCount = outbound.filter((candidate) => String(candidate.text ?? '').trim() === terminalCase.marker).length;
                                return terminalCase.expectedSendCount === 0 || matchingCount >= terminalCase.expectedSendCount ? run : undefined;
                              })().catch(() => undefined)
                        - 60000
                        - 250
                    - set: caseOutbound
                      value:
                        expr: state.getSnapshot().messages.slice(startIndex).filter((candidate) =>
                          candidate.direction === 'outbound' &&
                          candidate.conversation.id === conversationId)
                    - set: matchingOutbound
                      value:
                        expr: caseOutbound.filter((candidate) => String(candidate.text ?? '').trim() ===
                          terminalCase.marker)
                    - set: caseRequests
                      value:
                        expr: "env.mock ? await
                          fetchJson(`${env.mock.baseUrl}/debug/requests?after=${re\
                          questCursor}`) : []"
                    - set: publicDiagnosticCheckpoint
                      value:
                        expr: "await publishTerminalDiagnostic({ captureStage: 'public-case-observed',
                          activePhase, requestCursor, requestCount:
                          caseRequests.length, requests:
                          snapshotTerminalRequests(caseRequests.slice(0, 4)),
                          omittedRequestCount: Math.max(0, caseRequests.length -
                          4) })"
                    - set: directFallbackReceipts
                      value:
                        expr: await readDirectFallbackReceipts(terminalRun)
                    - assert:
                        expr: terminalCase.name === 'silent' || (directFallbackReceipts.length === 1 &&
                          directFallbackReceipts[0].content.filter((block) =>
                          block.type === 'text').map((block) =>
                          block.text).join('') === terminalCase.marker)
                        message:
                          expr: "`terminal ${terminalCase.name}: missing or duplicate direct-fallback
                            receipt: ${JSON.stringify(directFallbackReceipts)}`"
                    - assert:
                        expr: caseOutbound.filter((message) => !message.deleted && String(message.text
                          ?? '').trim() === config.parentAcknowledgment).length
                          === 1
                        message:
                          expr: "`terminal ${terminalCase.name}: spawning parent did not acknowledge its
                            completed turn`"
                    - set: appendDirectFallbackProof
                      value:
                        expr: "directFallbackProofs.push({ case: terminalCase.name, runId:
                          terminalRun.runId, receiptKeys:
                          directFallbackReceipts.map((message) =>
                          message.__openclaw.idempotencyKey) })"
                    - assert:
                        expr: matchingOutbound.length === terminalCase.expectedSendCount
                        message:
                          expr: "`terminal ${terminalCase.name}: expected
                            ${terminalCase.expectedSendCount} outbound, got
                            ${matchingOutbound.length};
                            messages=${JSON.stringify(state.getSnapshot().messa\
                            ges.slice(-10))}
                            requests=${JSON.stringify(caseRequests)}
                            logs=${JSON.stringify((env.gateway.logs?.().split('\
                            \\n') ?? []).filter((line) =>
                            /qa-channel|subagent|announce|completion|requester/\
                            i.test(line)).slice(-30))}`"
                    - assert:
                        expr: caseOutbound.every((candidate) => !String(candidate.text ??
                          '').includes(config.metadataSentinel) &&
                          !String(candidate.text ??
                          '').includes('BEGIN_OPENCLAW_INTERNAL_CONTEXT'))
                        message:
                          expr: "`terminal ${terminalCase.name}: protected internal metadata leaked;
                            outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: caseOutbound.every((candidate) => String(candidate.text ?? '').trim() !==
                          'NO_REPLY')
                        message:
                          expr: "`terminal ${terminalCase.name}: exact silence token leaked to the
                            channel; outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: caseOutbound.every((candidate) => !String(candidate.text ??
                          '').includes(`Agent couldn't generate a response`))
                        message:
                          expr: "`terminal ${terminalCase.name}: unexpected failure diagnostic;
                            outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: caseOutbound.every((candidate) => !String(candidate.text ??
                          '').includes(`Yield:`))
                        message:
                          expr: "`terminal ${terminalCase.name}: yield raced child completion;
                            outbound=${recentOutboundSummary(state)}`"
                    - assert:
                        expr: caseRequests.some((request) => request.plannedToolName ===
                          'sessions_spawn' && request.plannedToolArgs?.label ===
                          `qa-terminal-${terminalCase.name}`)
                        message:
                          expr: "`terminal ${terminalCase.name}: sessions_spawn not observed;
                            requests=${JSON.stringify(caseRequests)}`"
                    - assert:
                        expr: "!caseRequests.some((request) => request.plannedToolName ===
                          'sessions_yield')"
                        message:
                          expr: "`terminal ${terminalCase.name}: parent did not end before direct
                            fallback; requests=${JSON.stringify(caseRequests)}`"
                    - assert:
                        expr: terminalRun.label === `qa-terminal-${terminalCase.name}` &&
                          terminalRun.execution.status === 'terminal' &&
                          terminalRun.execution.outcome?.status === 'ok' &&
                          terminalRun.delivery?.status === 'delivered'
                        message:
                          expr: "`terminal ${terminalCase.name}: native lifecycle did not settle
                            authoritatively;
                            run=${JSON.stringify(terminalRun)}`"
                    - set: appendVerdict
                      value:
                        expr: "verdicts.push({ case: terminalCase.name, conversationId, runId:
                          terminalRun.runId, deliveryStatus:
                          terminalRun.delivery?.status, inputDisposition:
                          terminalCase.name, representation: terminalCase.name
                          === 'silent' ? 'visible representation of private
                          child silence or missing output' : 'exact terminal
                          text', restart: false, fallback: terminalCase.name ===
                          'fallback', expectedTerminalSendCount:
                          terminalCase.expectedSendCount,
                          actualTerminalSendCount: matchingOutbound.length,
                          capturedTerminalPayloads:
                          matchingOutbound.map((message) => String(message.text
                          ?? '')), auxiliaryChannelEvents:
                          caseOutbound.filter((message) =>
                          !matchingOutbound.includes(message)).map((message) =>
                          String(message.text ?? '')), silenceTokenLeaked:
                          caseOutbound.some((message) => String(message.text ??
                          '').trim() === 'NO_REPLY'), internalMetadataLeak:
                          caseOutbound.some((message) => String(message.text ??
                          '').includes(config.metadataSentinel)), pass: true })"
            catchAs: terminalFlowError
            catch:
              - set: rethrowTerminalFailure
                value:
                  expr: "(() => { throw new Error(`[${activePhase}] ${terminalFlowError instanceof
                    Error ? terminalFlowError.message :
                    String(terminalFlowError)}`, { cause: terminalFlowError });
                    })()"
            finally:
              - set: terminalDiagnostics
                value:
                  expr: >
                    (async () => {
                      // Keep the first completion, current phase, and latest request even if a fixture loops.
                      const bounded = (value, limit) => {
                        const json = JSON.stringify(value);
                        return json === undefined ? null : json.length > limit ? { omitted: true, serializedCharacters: json.length } : value;
                      };
                      const [requests, runList] = await Promise.all([
                        fetchJson(`${env.mock.baseUrl}/debug/requests?after=${suiteRequestCursor}`),
                        readNativeQaSubagentRuns(env).then(runs => ({ runs })).catch(error => ({ runs: [], captureError: String(error) }))
                      ]);
                      const phaseRequests = requests.filter(request => request.cursor > activeRequestCursor);
                      const selectedRequests = [...new Map([...requests.slice(0, 4), ...phaseRequests.slice(0, 2), ...requests.slice(-2)].map(request => [request.cursor, request])).values()];
                      const selected = snapshotTerminalRequests(selectedRequests);
                      const runs = (runList.runs ?? []).slice(0, 20).map(run => ({
                        runId: run.runId, label: run.label, execution: run.execution, delivery: run.delivery,
                        childSessionKey: run.childSessionKey
                      }));
                      const outbound = state.getSnapshot().events.filter(event => event.cursor > suiteEventCursor && ['outbound-message', 'message-edited', 'message-deleted'].includes(event.kind));
                      const artifact = { captureStage: 'final', activePhase, suiteRequestCursor, activeRequestCursor, suiteEventCursor,
                        requestCount: requests.length, omittedRequestCount: requests.length - selected.length, requests: selected,
                        runCount: runList.runs?.length ?? 0, runs, runCaptureError: runList.captureError,
                        outboundEventCount: outbound.length, outboundEvents: bounded(outbound.slice(-20), 65536),
                        failure: typeof terminalFlowError === 'undefined' ? null : String(terminalFlowError) };
                      return await publishTerminalDiagnostic(artifact);
                    })().catch(error => {
                      const primary = typeof terminalFlowError === 'undefined' ? 'scenario completed' : String(terminalFlowError);
                      throw new Error(`[${activePhase}] ${primary}; diagnostic capture failed: ${String(error)}`, { cause: error });
                    })
      detailsExpr: JSON.stringify({ verdicts, directFallbackProofs },null,2)
